---

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - cmake
      - libboost-dev
      - libevent-dev
      - libsqlite3-dev
      - pkgconf
      - python3
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Fetch source code
  ansible.builtin.unarchive:
    src: https://bitcoincore.org/bin/bitcoin-core-{{ bitcoin_version }}/bitcoin-{{ bitcoin_version }}.tar.gz
    dest: /tmp
    remote_src: true

- name: Drop leftover build directory
  ansible.builtin.file:
    path: /tmp/bitcoin-{{ bitcoin_version }}/build
    state: absent

- name: Configure
  ansible.builtin.command: >
    cmake -B build
    -DBUILD_BENCH=OFF
    -DBUILD_GUI=OFF
    -DBUILD_TESTS=OFF
    -DBUILD_TX=ON
    -DBUILD_UTIL=ON
    -DBUILD_WALLET_TOOL=ON
    -DENABLE_IPC=OFF
    -DWITH_ZMQ=OFF
  args:
    chdir: /tmp/bitcoin-{{ bitcoin_version }}
  changed_when: true

- name: Build
  ansible.builtin.command: cmake --build build -j{{ ansible_processor_vcpus }}
  args:
    chdir: /tmp/bitcoin-{{ bitcoin_version }}
  changed_when: true

- name: Install
  ansible.builtin.command: cmake --install build
  args:
    chdir: /tmp/bitcoin-{{ bitcoin_version }}
  become: true
  notify: bitcoin_restart_bitcoind
  changed_when: true
